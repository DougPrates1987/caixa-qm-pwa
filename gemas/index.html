<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#003058">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gemas">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Brazil Gem Commerce — Códigos</title>
  <style>
    :root{
      --navy:#003058;
      --deep:#001e38;
      --teal:#1ebdb8;
      --teal-dark:#0e9490;
      --soft:#e3f6f4;
      --paper:#f6f4ee;
      --panel:#fdfcf9;
      --ink:#1c2430;
      --muted:#6b7280;
      --line:#e3e0d6;
      --serif:"Playfair Display",Georgia,serif;
      --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{font-family:var(--sans);color:var(--ink);background:var(--paper)}
    body:before{content:"";position:fixed;inset:0 0 auto 0;height:170px;background:linear-gradient(135deg,var(--deep),var(--navy));z-index:-1}
    .wrap{max-width:520px;margin:0 auto;padding:28px 18px 46px}
    .brand{text-align:center;color:#fff;padding:8px 8px 25px}
    .eyebrow{margin:0 0 7px;color:#82e2df;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:0;font-family:var(--serif);font-size:31px;line-height:1.16;font-weight:700;letter-spacing:-.01em}
    .brand-sub{margin:8px 0 0;color:#c9d8e3;font-size:12px;line-height:1.5}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:19px;margin-bottom:14px;box-shadow:0 9px 25px #0030580d}
    label{display:block;margin-bottom:8px;color:var(--navy);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    input{width:100%;height:54px;padding:0 14px;border:1px solid #bac4ca;border-radius:5px;background:#fff;color:var(--ink);font:600 23px/1 var(--sans);outline:none;letter-spacing:.03em}
    input:focus{border-color:var(--teal);box-shadow:0 0 0 3px #1ebdb824}
    button{width:100%;min-height:49px;margin-top:12px;padding:12px 15px;border:0;border-radius:5px;background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;font:700 13px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
    button:active{transform:translateY(1px)}
    .caption{margin-top:16px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .value{margin-top:4px;color:var(--navy);font-family:var(--serif);font-size:31px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
    .msg{min-height:18px;margin-top:9px;color:#b42318;font-size:12px;font-weight:600}
    .total{background:var(--navy);border-color:var(--navy);box-shadow:0 14px 30px #00305822}
    .total .caption{margin-top:0;color:#9fc0d4}
    .total .value{color:#fff;font-size:35px}
    .footer{text-align:center;margin-top:20px;color:#8a9099;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
    @media(max-width:420px){
      .wrap{padding:22px 14px 38px}
      .brand{padding-bottom:21px}
      h1{font-size:29px}
      .card{padding:17px}
      .value{font-size:29px}
      .total .value{font-size:33px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="brand">
      <p class="eyebrow">Brazil Gem Commerce</p>
      <h1>Decodificador de Códigos</h1>
      <p class="brand-sub">Cálculo interno de valor por quilate</p>
    </header>

    <section class="card">
      <label for="codigo">Código</label>
      <input id="codigo" type="text" placeholder="Digite o código" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="btnCodigo" type="button">Calcular valor por quilate</button>
      <div class="caption">Valor por quilate</div>
      <div class="value" id="valorCt">US$ 0 / ct</div>
      <div class="msg" id="msg"></div>
    </section>

    <section class="card">
      <label for="peso">Quantidade em quilates</label>
      <input id="peso" type="text" inputmode="decimal" placeholder="Ex.: 2,00">
      <button id="btnTotal" type="button">Calcular valor total</button>
    </section>

    <section class="card total">
      <div class="caption">Valor total</div>
      <div class="value" id="total">US$ 0</div>
    </section>

    <div class="footer">Brazil Gem Commerce</div>
  </div>

<script>
(() => {
  const mapa={C:'1',O:'2',L:'3',A:'4',S:'5',P:'6',R:'7',I:'8',T:'9',E:'0'};
  const codigo=document.getElementById('codigo');
  const peso=document.getElementById('peso');
  const valorCt=document.getElementById('valorCt');
  const total=document.getElementById('total');
  const msg=document.getElementById('msg');
  let preco=0;

  const usd=v=>new Intl.NumberFormat('pt-BR',{
    style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:0
  }).format(Math.round(v));

  function decode(raw){
    const s=raw.toUpperCase().replace(/\s+/g,'');
    if(!s) return {erro:'Digite o código.'};
    let out='',i=0;
    while(i<s.length){
      if(/\d/.test(s[i])){
        let n='';
        while(i<s.length && /\d/.test(s[i])) n+=s[i++];
        if(i>=s.length) return {erro:'O número precisa vir antes de uma letra.'};
        const l=s[i++];
        if(!(l in mapa)) return {erro:'Letra inválida: '+l};
        const q=parseInt(n,10);
        if(!Number.isInteger(q)||q<1||q>50) return {erro:'Repetição inválida.'};
        out+=mapa[l].repeat(q);
      }else{
        const l=s[i++];
        if(!(l in mapa)) return {erro:'Letra inválida: '+l};
        out+=mapa[l];
      }
    }
    const valor=Number(out);
    return Number.isFinite(valor)?{valor}:{erro:'Código inválido.'};
  }

  function calcCodigo(){
    codigo.value=codigo.value.toUpperCase();
    const r=decode(codigo.value);
    if(r.erro){
      preco=0;
      valorCt.textContent='US$ 0 / ct';
      total.textContent='US$ 0';
      msg.textContent=r.erro;
      return;
    }
    preco=r.valor;
    valorCt.textContent=usd(preco)+' / ct';
    total.textContent='US$ 0';
    msg.textContent='';
    peso.focus();
  }

  function calcTotal(){
    if(preco<=0){msg.textContent='Calcule primeiro o código.';return}
    const p=Number(peso.value.trim().replace(',','.'));
    if(!Number.isFinite(p)||p<0){msg.textContent='Digite uma quantidade válida em quilates.';return}
    msg.textContent='';
    total.textContent=usd(preco*p);
    peso.blur();
  }

  document.getElementById('btnCodigo').addEventListener('click',calcCodigo);
  document.getElementById('btnTotal').addEventListener('click',calcTotal);
  codigo.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calcCodigo()}});
  peso.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calcTotal()}});
  codigo.addEventListener('input',()=>{codigo.value=codigo.value.toUpperCase()});

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
